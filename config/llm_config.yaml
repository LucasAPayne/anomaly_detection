model_id: "meta-llama/Llama-3.3-70B-Instruct"

prompts:
    - >
      You are an information extraction system. 
      Your task is to extract all named entities from the following log message.

      Requirements:
      - Return ONLY the extracted entities in the exact order they appear.
      - Output format must be a single valid JSON array of strings. 
      - Do not include any explanations, commentary, or additional text. 
      - Do not include field prefixes (e.g., "user="), just the value. 
      - Combine dates and times into a single timestamp string if they appear together.
      - A file path should be considered a single entity. Do NOT split each folder into a separate entity.
      
    - >
      Classify each entity in the given list.
      Return your answer as a nicely-formatted list of (entity, type) pairs.
      For each entity, give ONLY ONE classification.

    - >
      Generate regular expressions, using only Python extensions, that would recognize each of entities you extracted in the previous steps.
      Use positive lookbehinds to make sure the regular expressions only match the extracted entities and nothing else.
      Do not return any code for this step.
      Only generate regular expressions for the entities you extracted, and your answer should be only the regular expressions.
      It is imperative that you return only one answer; do NOT provide additional explanation or examples.
      Only consider the following log message.

    - >
      Generate as many triples as possible from the following log message.
      Return as many triples as possible, and each entity should appear in a triple at least once.
      Triples should be of the form (subject, relation, object).
      Do NOT use 'None' for any item in a triple.
      It is imperative that you return ONLY the list of triples; do NOT return any additional information.
      Return ONLY ONE list of triples; do not offer further examples or try to correct yourself.
      Do not return any code for this step.
      Here is the log message to consider:
