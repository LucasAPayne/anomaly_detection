# Data
dataset: AIT
out_dir: results/kgc/AIT/AIT

# Training
model: complex # distmult, complex, conve
embedding_dim: 256
seed: 1234
epochs: 200 # max training epochs
batch_size: 128 # batch size
lr: 0.0005 # learning rate
l2: 0.0
negative_samples: 4

# Early stopping
use_stopper: true
frequency: 5 # How many epochs to wait before evaluating for early stopping
patience: 10 # Number of evaluations before stopping early
metric: mrr
